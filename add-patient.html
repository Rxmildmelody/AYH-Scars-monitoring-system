<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>เพิ่มผู้ป่วยใหม่ - SCARs</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>body { font-family: 'Prompt', sans-serif; background-color: #f8f9fa; }</style>
</head>
<body>

    <nav class="navbar navbar-dark bg-primary"><div class="container"><a class="navbar-brand" href="dashboard.html"><i class="bi bi-arrow-left"></i> กลับไป Dashboard</a></div></nav>

    <div class="container mt-4">
        <div class="card shadow-sm border-0" style="border-radius: 12px; max-width: 600px; margin: auto;">
            <div class="card-body p-4">
                <h4 class="text-primary fw-bold mb-4">เพิ่มผู้ป่วยใหม่</h4>
                <form>
                    <div class="mb-3">
                        <label class="form-label">HN</label>
                        <input type="text" class="form-control" placeholder="ระบุรหัสประจำตัวผู้ป่วย">
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">ชื่อ</label>
                            <input type="text" class="form-control" placeholder="ชื่อจริง">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">นามสกุล</label>
                            <input type="text" class="form-control" placeholder="นามสกุล">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">ยาที่ได้รับ</label>
                        <input type="text" class="form-control" placeholder="เช่น Allopurinol, Carbamazepine">
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">วันที่เริ่มยา</label>
                            <input type="date" class="form-control">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">จำนวนวันติดตาม</label>
                            <input type="number" class="form-control" placeholder="ระบุจำนวนวัน">
                        </div>
                    </div>
                    <div class="mb-4">
                        <label class="form-label">หมายเหตุ</label>
                        <textarea class="form-control" rows="2"></textarea>
                    </div>
                    <!-- ปุ่มจำลองการทำงาน -->
                    <a href="patient-list.html" class="btn btn-primary w-100">บันทึกข้อมูล</a>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
