<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - SCARs Monitoring</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; background-color: #ffffff; }
        .stat-card { border-radius: 12px; border: none; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .menu-btn { height: 100px; border-radius: 12px; font-size: 1.1rem; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .menu-btn i { font-size: 2rem; margin-bottom: 8px; }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand fw-bold" href="dashboard.html">
                <i class="bi bi-shield-plus"></i> SCARs Monitoring System
            </a>
            <a href="index.html" class="btn btn-outline-light btn-sm">ออกจากระบบ</a>
        </div>
    </nav>

    <div class="container mt-4">
        <h4 class="fw-bold mb-4"><i class="bi bi-house-door text-primary"></i> Dashboard</h4>

        <!-- สถิติ (Stats) -->
        <div class="row g-3 mb-5">
            <div class="col-6 col-md-3">
                <div class="card stat-card bg-primary text-white h-100">
                    <div class="card-body text-center">
                        <h6 class="mb-2">👥 ผู้ป่วยทั้งหมด</h6>
                        <h2 class="fw-bold mb-0">135</h2>
                    </div>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="card stat-card bg-success text-white h-100">
                    <div class="card-body text-center">
                        <h6 class="mb-2">🟢 ลงทะเบียนแล้ว</h6>
                        <h2 class="fw-bold mb-0">120</h2>
                    </div>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="card stat-card bg-warning text-dark h-100">
                    <div class="card-body text-center">
                        <h6 class="mb-2">🟡 รอตอบแบบประเมิน</h6>
                        <h2 class="fw-bold mb-0">18</h2>
                    </div>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="card stat-card bg-danger text-white h-100">
                    <div class="card-body text-center">
                        <h6 class="mb-2">🔴 Risk Alert</h6>
                        <h2 class="fw-bold mb-0">3</h2>
                    </div>
                </div>
            </div>
        </div>

        <!-- เมนูลัด (Quick Actions) -->
        <div class="row g-3">
            <div class="col-6 col-md-3">
                <a href="add-patient.html" class="btn btn-outline-primary w-100 menu-btn">
                    <i class="bi bi-person-plus"></i> เพิ่มผู้ป่วยใหม่
                </a>
            </div>
            <div class="col-6 col-md-3">
                <a href="patient-list.html" class="btn btn-outline-primary w-100 menu-btn">
                    <i class="bi bi-list-ul"></i> รายชื่อผู้ป่วย
                </a>
            </div>
            <div class="col-6 col-md-3">
                <button class="btn btn-outline-primary w-100 menu-btn">
                    <i class="bi bi-journal-medical"></i> พิมพ์สมุดติดตาม
                </button>
            </div>
            <div class="col-6 col-md-3">
                <button class="btn btn-outline-primary w-100 menu-btn">
                    <i class="bi bi-bar-chart-line"></i> รายงาน
                </button>
            </div>
        </div>
    </div>

</body>
</html>
