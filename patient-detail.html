<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>รายละเอียดผู้ป่วย - SCARs</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>body { font-family: 'Prompt', sans-serif; background-color: #f8f9fa; }</style>
</head>
<body>

    <nav class="navbar navbar-dark bg-primary"><div class="container"><a class="navbar-brand" href="patient-list.html"><i class="bi bi-arrow-left"></i> กลับไปรายชื่อผู้ป่วย</a></div></nav>

    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow-sm border-0" style="border-radius: 12px;">
                    <div class="card-header bg-white border-bottom-0 pt-4 pb-0 d-flex justify-content-between align-items-center">
                        <h4 class="text-primary fw-bold mb-0">ข้อมูลผู้ป่วย (SCARs Profile)</h4>
                        <span class="badge bg-danger fs-6">Risk Alert</span>
                    </div>
                    <div class="card-body p-4">
                        <div class="row mb-4">
                            <div class="col-sm-8">
                                <table class="table table-borderless mb-0">
                                    <tr><th class="text-secondary" width="120">ชื่อ-สกุล:</th><td class="fw-bold fs-5">สมชาย ใจดี</td></tr>
                                    <tr><th class="text-secondary">HN:</th><td>123456</td></tr>
                                    <tr><th class="text-secondary">Case ID:</th><td>SCAR-26-001</td></tr>
                                    <tr><th class="text-secondary">ยาที่ได้รับ:</th><td>Allopurinol</td></tr>
                                    <tr><th class="text-secondary">วันที่เริ่มยา:</th><td>01/08/2026</td></tr>
                                    <tr><th class="text-secondary">สถานะ LINE:</th><td><span class="text-success"><i class="bi bi-check-circle-fill"></i> ผูกบัญชีแล้ว</span></td></tr>
                                </table>
                            </div>
                            <div class="col-sm-4 text-center border-start">
                                <p class="text-muted mb-2">QR Code ประจำตัว</p>
                                <!-- กล่องจำลอง QR Code -->
                                <div class="bg-light d-flex align-items-center justify-content-center mx-auto mb-2" style="width: 120px; height: 120px; border: 2px dashed #ccc;">
                                    <i class="bi bi-qr-code fs-1 text-secondary"></i>
                                </div>
                                <small class="text-muted">ID: SCAR-26-001</small>
                            </div>
                        </div>

                        <hr>
                        
                        <div class="d-flex justify-content-between">
                            <button class="btn btn-primary"><i class="bi bi-printer"></i> พิมพ์สมุด</button>
                            <div>
                                <button class="btn btn-outline-secondary me-2"><i class="bi bi-pencil"></i> แก้ไข</button>
                                <button class="btn btn-outline-danger"><i class="bi bi-trash"></i> ลบ</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
